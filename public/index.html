<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0a14">
<title>T19 Draw — Zabava za Trepcu</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a14;--s1:#12121f;--s2:#1a1a2e;
  --acc:#ff3e6c;--acc2:#ff8c42;--blue:#00d4ff;
  --green:#00e676;--purple:#b44ffd;--gold:#ffd700;
  --text:#f0f0ff;--dim:#7878a0;--brd:rgba(255,255,255,0.08);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Nunito',sans-serif;overscroll-behavior:none;}
::-webkit-scrollbar{width:3px;}::-webkit-scrollbar-thumb{background:var(--brd);}

.screen{display:none;height:100%;width:100%;flex-direction:column;}
.screen.on{display:flex;}

/* ── CONNECTING ── */
#conn-screen{align-items:center;justify-content:center;gap:16px;}
.spin{width:36px;height:36px;border:3px solid var(--brd);border-top-color:var(--acc);border-radius:50%;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── START ── */
#start-screen{align-items:center;justify-content:center;padding:20px;gap:0;
  background:radial-gradient(ellipse at 30% 20%,rgba(0,212,255,.06),transparent 55%),
             radial-gradient(ellipse at 70% 80%,rgba(255,62,108,.08),transparent 55%),var(--bg);}
.logo{text-align:center;margin-bottom:28px;}
.logo h1{font-family:'Syne',sans-serif;font-size:clamp(2.5rem,9vw,4.5rem);font-weight:800;letter-spacing:-2px;
  background:linear-gradient(135deg,var(--acc),var(--acc2),var(--blue));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.logo p{font-size:.7rem;letter-spacing:.4em;color:var(--dim);text-transform:uppercase;margin-top:4px;}
.card{background:var(--s1);border:1px solid var(--brd);border-radius:20px;padding:24px;width:100%;max-width:400px;}
.tabs{display:flex;background:var(--s2);border-radius:12px;padding:3px;margin-bottom:20px;}
.tab{flex:1;padding:9px;border:none;background:transparent;color:var(--dim);
  font-family:'Nunito',sans-serif;font-weight:700;font-size:.85rem;border-radius:9px;cursor:pointer;transition:.2s;}
.tab.on{background:var(--acc);color:#fff;}
.pnl{display:none;flex-direction:column;gap:12px;}.pnl.on{display:flex;}
.lbl{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--dim);display:block;margin-bottom:5px;}
input,select{width:100%;background:var(--s2);border:1px solid var(--brd);border-radius:11px;
  padding:12px 15px;color:var(--text);font-family:'Nunito',sans-serif;font-weight:700;font-size:.95rem;
  outline:none;transition:.2s;-webkit-appearance:none;}
input:focus,select:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(255,62,108,.15);}
.av-row{display:flex;gap:7px;flex-wrap:wrap;}
.av{width:38px;height:38px;border-radius:9px;border:2px solid transparent;background:var(--s2);
  font-size:1.25rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;}
.av.on{border-color:var(--acc);background:rgba(255,62,108,.12);}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:13px 22px;border:none;
  border-radius:13px;font-family:'Syne',sans-serif;font-weight:800;font-size:.85rem;cursor:pointer;
  transition:transform .15s,filter .15s;text-transform:uppercase;letter-spacing:.5px;}
.btn:hover{transform:translateY(-2px);filter:brightness(1.1);}
.btn:active{transform:translateY(0);}
.btn-p{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;box-shadow:0 8px 24px rgba(255,62,108,.3);}
.btn-b{background:linear-gradient(135deg,var(--blue),#0090cc);color:#000;box-shadow:0 8px 24px rgba(0,212,255,.2);}
.btn-g{background:linear-gradient(135deg,var(--green),#00b050);color:#000;}
.btn-ghost{background:var(--s2);color:var(--dim);border:1px solid var(--brd);}
.btn-sm{padding:7px 14px;font-size:.72rem;border-radius:9px;}
.code-inp{font-family:'Syne',sans-serif;font-size:1.6rem;font-weight:800;text-align:center;letter-spacing:.4em;text-transform:uppercase;}

/* ── LOBBY ── */
#lobby-screen{overflow:hidden;}
.lhdr{background:var(--s1);border-bottom:1px solid var(--brd);padding:12px 18px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-shrink:0;}
.lhdr-title{font-family:'Syne',sans-serif;font-size:1.1rem;font-weight:800;}
.rcode{background:var(--s2);border:1px solid var(--brd);border-radius:9px;padding:5px 13px;
  font-family:'Syne',sans-serif;font-weight:800;font-size:.95rem;letter-spacing:.15em;
  color:var(--blue);cursor:pointer;transition:.2s;}
.rcode:hover{background:rgba(0,212,255,.1);}
.lbody{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;}
.pcard{background:var(--s1);border:1px solid var(--brd);border-radius:13px;padding:12px;
  text-align:center;animation:popIn .3s ease;}
.pcard.host{border-color:var(--gold);}
.pcard.me{border-color:var(--acc);}
.pcard.gone{opacity:.4;}
.pac{font-size:1.8rem;}
.pname{font-weight:700;font-size:.82rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pbadge{font-size:.6rem;color:var(--dim);text-transform:uppercase;letter-spacing:1px;}
.pcard.host .pbadge{color:var(--gold);}
.sbox{background:var(--s1);border:1px solid var(--brd);border-radius:14px;padding:14px;}
.srow{display:flex;gap:9px;}
.srow>div{flex:1;}
.invbox{background:linear-gradient(135deg,rgba(0,212,255,.04),rgba(255,62,108,.04));
  border:1px solid var(--brd);border-radius:13px;padding:13px;text-align:center;}
.invlink{font-size:.75rem;color:var(--blue);word-break:break-all;margin:7px 0;font-family:monospace;}
.inv-btns{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-top:7px;}
.lftr{padding:12px 18px;border-top:1px solid var(--brd);background:var(--s1);flex-shrink:0;}

/* ── GAME ── */
#game-screen{overflow:hidden;}
.ghdr{background:var(--s1);border-bottom:1px solid var(--brd);padding:7px 13px;
  display:flex;align-items:center;justify-content:space-between;gap:9px;flex-shrink:0;min-height:50px;}
.glogo{font-family:'Syne',sans-serif;font-size:1rem;font-weight:800;
  background:linear-gradient(135deg,var(--acc),var(--blue));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.rinfo{display:flex;align-items:center;gap:8px;}
.rpill{background:var(--s2);border:1px solid var(--brd);border-radius:7px;
  padding:3px 11px;font-weight:700;font-size:.75rem;color:var(--dim);}
.rpill b{color:var(--text);}
.twrap{position:relative;width:42px;height:42px;}
.twrap svg{transform:rotate(-90deg);}
.ttrack{fill:none;stroke:var(--s2);stroke-width:3.5;}
.tprog{fill:none;stroke:var(--blue);stroke-width:3.5;stroke-linecap:round;
  stroke-dasharray:119.38;transition:stroke-dashoffset 1s linear,stroke .3s;}
.tnum{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:'Syne',sans-serif;font-size:.75rem;font-weight:800;}
.sbadge{text-align:right;}
.sval{font-family:'Syne',sans-serif;font-size:1rem;font-weight:800;color:var(--acc2);}
.slbl{font-size:.58rem;color:var(--dim);text-transform:uppercase;letter-spacing:1px;}

.gbody{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0;}

/* canvas area */
.carea{display:flex;flex-direction:column;flex:1;min-height:0;padding:7px;gap:6px;}
.wbar{background:var(--s1);border:1px solid var(--brd);border-radius:11px;padding:8px 13px;
  display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.wletters{display:flex;gap:5px;flex-wrap:wrap;align-items:flex-end;}
.wl{font-family:'Syne',sans-serif;font-size:1.15rem;font-weight:800;min-width:16px;text-align:center;
  border-bottom:2.5px solid var(--acc);padding-bottom:2px;line-height:1;transition:.3s;}
.wl.h{color:transparent;}
.wl.sp{border:none;width:9px;}
.hbtn{background:rgba(180,79,253,.15);border:1px solid rgba(180,79,253,.3);border-radius:8px;
  padding:5px 11px;color:var(--purple);font-family:'Nunito',sans-serif;font-weight:700;
  font-size:.72rem;cursor:pointer;white-space:nowrap;transition:.2s;}
.hbtn:hover{background:rgba(180,79,253,.25);}
.hbtn:disabled{opacity:.3;cursor:not-allowed;}
.cwrap{position:relative;flex:1;min-height:0;border-radius:13px;overflow:hidden;
  background:#fff;box-shadow:0 14px 36px rgba(0,0,0,.5);}
#cvs{display:block;width:100%;height:100%;cursor:crosshair;touch-action:none;}
.cov{position:absolute;inset:0;background:rgba(10,10,20,.92);backdrop-filter:blur(10px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  padding:20px;text-align:center;opacity:0;pointer-events:none;transition:opacity .3s;}
.cov.on{opacity:1;pointer-events:all;}
.ov-title{font-family:'Syne',sans-serif;font-size:1.5rem;font-weight:800;}
.ov-word{font-family:'Syne',sans-serif;font-size:1.2rem;color:var(--acc);
  background:rgba(255,62,108,.1);border:1px solid rgba(255,62,108,.3);border-radius:9px;padding:7px 18px;}

.tools{background:var(--s1);border:1px solid var(--brd);border-radius:11px;padding:7px 9px;
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;flex-shrink:0;}
.pal{display:flex;gap:4px;flex-wrap:wrap;}
.sw{width:22px;height:22px;border-radius:5px;border:2px solid transparent;cursor:pointer;transition:.12s;flex-shrink:0;}
.sw:hover{transform:scale(1.2);}
.sw.on{border-color:#fff;transform:scale(1.15);box-shadow:0 0 7px rgba(255,255,255,.3);}
.vd{width:1px;height:22px;background:var(--brd);flex-shrink:0;}
.tb{width:30px;height:30px;border-radius:7px;border:1px solid var(--brd);background:var(--s2);
  color:var(--dim);cursor:pointer;font-size:.95rem;display:flex;align-items:center;justify-content:center;transition:.15s;flex-shrink:0;}
.tb:hover,.tb.on{background:var(--acc);color:#fff;border-color:var(--acc);}
.szsl{-webkit-appearance:none;width:56px;height:3px;border-radius:2px;background:var(--s2);outline:none;}
.szsl::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--acc);cursor:pointer;}
.szdot-wrap{width:26px;height:26px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.szdot{background:#333;border-radius:50%;transition:.2s;}

/* bottom panel */
.bpanel{height:175px;min-height:175px;display:flex;flex-direction:row;
  border-top:1px solid var(--brd);flex-shrink:0;background:var(--s1);}
.pstrip{width:82px;border-right:1px solid var(--brd);overflow-y:auto;
  display:flex;flex-direction:column;gap:0;padding:5px 3px;}
.pi{display:flex;flex-direction:column;align-items:center;padding:5px 2px;border-radius:9px;transition:.2s;gap:1px;}
.pi.drawing{background:rgba(0,212,255,.1);border:1px solid rgba(0,212,255,.2);}
.pi.guessed{background:rgba(0,230,118,.07);}
.pi.gone{opacity:.35;}
.piav{font-size:1.3rem;line-height:1;}
.piname{font-size:.56rem;font-weight:700;text-align:center;width:70px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--dim);}
.pi.me .piname{color:var(--text);}
.piscr{font-family:'Syne',sans-serif;font-size:.6rem;font-weight:800;color:var(--acc2);}

.chat-sec{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.chatmsgs{flex:1;overflow-y:auto;padding:5px 9px;display:flex;flex-direction:column;gap:3px;}
.cm{display:flex;gap:5px;align-items:flex-start;animation:msgIn .2s ease;}
.cm .emj{font-size:.85rem;flex-shrink:0;margin-top:1px;}
.cm .bd .nm{font-size:.63rem;color:var(--dim);font-weight:700;}
.cm .bd .tx{font-size:.77rem;font-weight:600;word-break:break-word;}
.cm.ok .tx{color:var(--green);}
.cm.cl .tx{color:var(--acc2);}
.cm.sys .tx{color:var(--dim);font-style:italic;font-size:.72rem;}
.chat-inp-row{display:flex;gap:5px;padding:5px 7px;border-top:1px solid var(--brd);flex-shrink:0;}
#chatinp{flex:1;background:var(--s2);border:1px solid var(--brd);border-radius:9px;
  padding:8px 11px;color:var(--text);font-family:'Nunito',sans-serif;font-weight:700;
  font-size:.82rem;outline:none;transition:.2s;}
#chatinp:focus{border-color:var(--blue);}
.sendbtn{width:36px;height:36px;border-radius:9px;border:none;background:var(--blue);
  color:#000;font-size:.95rem;cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-weight:900;transition:.2s;flex-shrink:0;}
.sendbtn:hover{filter:brightness(1.15);}

/* desktop */
@media(min-width:768px){
  .gbody{flex-direction:row;}
  .carea{flex:1;min-width:0;}
  .bpanel{width:270px;height:100%;min-height:0;flex-direction:column;border-top:none;border-left:1px solid var(--brd);}
  .pstrip{width:100%;max-height:130px;flex-direction:row;flex-wrap:wrap;border-right:none;border-bottom:1px solid var(--brd);}
  .pi{flex-direction:row;padding:5px 7px;gap:6px;}
  .piname{width:78px;text-align:left;}
  .chat-sec{flex:1;min-height:0;}
}

/* ── OVERLAYS ── */
#wco{position:fixed;inset:0;background:rgba(10,10,20,.96);backdrop-filter:blur(12px);
  z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:20px;}
#wco.on{display:flex;}
.wco-title{font-family:'Syne',sans-serif;font-size:1.4rem;font-weight:800;text-align:center;}
.wcards{display:flex;gap:11px;flex-wrap:wrap;justify-content:center;width:100%;max-width:480px;}
.wcard{flex:1;min-width:110px;max-width:150px;background:var(--s1);border:2px solid var(--brd);
  border-radius:15px;padding:16px 12px;text-align:center;cursor:pointer;transition:.25s;}
.wcard:hover{border-color:var(--acc);transform:translateY(-4px);box-shadow:0 12px 28px rgba(255,62,108,.2);}
.wcat{font-size:.62rem;text-transform:uppercase;letter-spacing:2px;color:var(--acc);margin-bottom:5px;font-weight:700;}
.wword{font-family:'Syne',sans-serif;font-size:1.05rem;font-weight:800;}
.wcprog{height:3px;background:var(--s2);border-radius:2px;margin-top:12px;overflow:hidden;}
.wcbar{height:100%;background:linear-gradient(90deg,var(--acc),var(--blue));transition:width 12s linear;}

#reo{position:fixed;inset:0;background:rgba(10,10,20,.9);backdrop-filter:blur(8px);
  z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;}
#reo.on{display:flex;}
.re-word{font-family:'Syne',sans-serif;font-size:1.8rem;font-weight:800;color:var(--acc);}
.rescores{display:flex;flex-direction:column;gap:5px;width:100%;max-width:310px;}
.rerow{display:flex;align-items:center;gap:9px;background:var(--s1);
  border:1px solid var(--brd);border-radius:11px;padding:9px 13px;}
.rerank{font-family:'Syne',sans-serif;font-weight:800;font-size:.95rem;width:22px;color:var(--dim);}
.rerank.g{color:var(--gold);}
.reav{font-size:1.1rem;}
.rename{flex:1;font-weight:700;font-size:.85rem;}
.resc{font-family:'Syne',sans-serif;font-weight:800;font-size:.9rem;color:var(--acc2);}

#geo{position:fixed;inset:0;background:var(--bg);z-index:300;display:none;
  flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center;overflow-y:auto;}
#geo.on{display:flex;}
.ge-trophy{font-size:3.5rem;animation:bounceIn .6s cubic-bezier(.36,.07,.19,.97);}
.ge-title{font-family:'Syne',sans-serif;font-size:1.8rem;font-weight:800;
  background:linear-gradient(135deg,var(--gold),var(--acc2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}

/* notifs */
#notifw{position:fixed;top:56px;left:50%;transform:translateX(-50%);z-index:999;
  display:flex;flex-direction:column;gap:5px;pointer-events:none;align-items:center;}
.notif{background:var(--s1);border:1px solid var(--brd);border-radius:11px;padding:9px 16px;
  font-weight:700;font-size:.8rem;display:flex;align-items:center;gap:7px;white-space:nowrap;
  animation:nIn .3s ease,nOut .3s ease 1.7s both;box-shadow:0 8px 22px rgba(0,0,0,.4);}
.notif.s{border-color:var(--green);color:var(--green);}
.notif.w{border-color:var(--acc2);color:var(--acc2);}
.notif.i{border-color:var(--blue);color:var(--blue);}

.sfloat{position:fixed;font-family:'Syne',sans-serif;font-size:1.3rem;font-weight:800;
  color:var(--green);text-shadow:0 0 18px rgba(0,230,118,.5);pointer-events:none;
  animation:sfUp 1.3s ease forwards;z-index:500;}

@keyframes popIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
@keyframes msgIn{from{opacity:0;transform:translateX(5px)}to{opacity:1;transform:translateX(0)}}
@keyframes bounceIn{0%{transform:scale(0)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
@keyframes nIn{from{opacity:0;transform:translateY(-7px)}to{opacity:1;transform:translateY(0)}}
@keyframes nOut{from{opacity:1}to{opacity:0;transform:translateY(-7px)}}
@keyframes sfUp{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-65px) scale(1.3)}}
@keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>

<div id="notifw"></div>

<!-- CONNECTING -->
<div class="screen on" id="conn-screen">
  <div class="spin"></div>
  <div style="font-family:'Syne',sans-serif;font-size:1.6rem;font-weight:800;
    background:linear-gradient(135deg,#ff3e6c,#00d4ff);-webkit-background-clip:text;
    -webkit-text-fill-color:transparent;background-clip:text;">T19 DRAW</div>
  <div id="connlbl" style="color:var(--dim);font-size:.8rem;">Spajam se...</div>
  <button id="retrybtn" onclick="connect()" style="display:none;margin-top:6px;padding:9px 20px;
    background:var(--acc);color:#fff;border:none;border-radius:10px;
    font-family:'Syne',sans-serif;font-weight:800;cursor:pointer;">Pokusaj ponovo</button>
</div>

<!-- START -->
<div class="screen" id="start-screen">
  <div class="logo">
    <h1>T19 DRAW</h1>
    <p>Zabava za Trepcu</p>
  </div>
  <div class="card" style="animation:slideUp .5s ease;">
    <div class="tabs">
      <button class="tab on" id="tab-c" onclick="switchTab('c')">Kreiraj sobu</button>
      <button class="tab" id="tab-j" onclick="switchTab('j')">Pridruzi se</button>
    </div>
    <div class="pnl on" id="pnl-c">
      <div><label class="lbl">Tvoje ime</label><input type="text" id="c-name" placeholder="Upiši ime..." maxlength="18" value="Igrac"></div>
      <div><label class="lbl">Avatar</label><div class="av-row" id="avs-c"></div></div>
      <button class="btn btn-p" onclick="createRoom()">Kreiraj sobu</button>
    </div>
    <div class="pnl" id="pnl-j">
      <div><label class="lbl">Tvoje ime</label><input type="text" id="j-name" placeholder="Upiši ime..." maxlength="18" value="Igrac"></div>
      <div><label class="lbl">Avatar</label><div class="av-row" id="avs-j"></div></div>
      <div><label class="lbl">Kod sobe</label><input type="text" class="code-inp" id="j-code" placeholder="ABC123" maxlength="6"></div>
      <button class="btn btn-b" onclick="joinRoom()">Uci u sobu</button>
    </div>
  </div>
</div>

<!-- LOBBY -->
<div class="screen" id="lobby-screen">
  <div class="lhdr">
    <div class="lhdr-title" style="font-family:'Syne',sans-serif;">T19 DRAW</div>
    <div class="rcode" id="lcode" onclick="copyCode()" title="Kopiraj kod">------</div>
    <button class="btn btn-ghost btn-sm" onclick="leaveRoom()">Izlaz</button>
  </div>
  <div class="lbody">
    <div style="font-size:.7rem;color:var(--dim);text-transform:uppercase;letter-spacing:1px;font-weight:700;">Igraci (<span id="lcnt">0</span>)</div>
    <div class="pgrid" id="lgrid"></div>
    <div class="sbox" id="hsettings" style="display:none;">
      <div style="font-size:.7rem;color:var(--dim);text-transform:uppercase;letter-spacing:1px;font-weight:700;margin-bottom:9px;">Podesavanja</div>
      <div class="srow">
        <div><label class="lbl">Rundi</label>
          <select id="s-rnd" onchange="updSettings()">

<script>
// ───────────────────────────────────────────────
// STATE
// ───────────────────────────────────────────────
const WSURL = (location.protocol==='https:'?'wss://':'ws://')+location.host;
const AVATARS = ['😀','😎','🥸','🤩','😜','🥳','😏','🤓','👻','🐱','🐶','🦊','🐸','🦁','🐼','🤖','👾','🎃','🐲','🦄'];
const COLORS  = ['#000000','#ffffff','#ef4444','#f97316','#eab308','#22c55e','#3b82f6','#8b5cf6','#ec4899','#6b7280','#92400e','#065f46','#1e40af','#7c3aed','#fbbf24','#34d399','#60a5fa','#a78bfa','#f9a8d4','#06b6d4'];

let ws=null, myId=null, myRoom=null, isHost=false;
let myAvatar=AVATARS[0], myName='Igrac';
let totalRnds=8, roundTime=90, curRnd=0, timeLeft=90;
let isDrawer=false, myScore=0, hasGuessed=false;
let revMask='';
let timerInt=null, pingInt=null, reconTimer=null, connected=false;

// canvas
let cvs, ctx, drawing=false, tool='brush', color='#000000', size=8;
let lx=0,ly=0,sx=0,sy=0, undoStack=[];

// ───────────────────────────────────────────────
// WAKE LOCK
// ───────────────────────────────────────────────
let wl=null;
async function reqWL(){try{if('wakeLock' in navigator){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>setTimeout(reqWL,1000));}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')reqWL();});
reqWL();

// ───────────────────────────────────────────────
// WEBSOCKET
// ───────────────────────────────────────────────
function connect(){
  if(ws&&(ws.readyState===0||ws.readyState===1))return;
  try{ws=new WebSocket(WSURL);}catch(e){sched();return;}

  ws.onopen=()=>{
    connected=true;
    document.getElementById('conn-screen').classList.remove('on');
    // Try reconnect with saved session
    const sid=sessionStorage.getItem('t19id');
    const sroom=sessionStorage.getItem('t19room');
    if(sid&&sroom&&!myRoom){
      send({type:'reconnect',playerId:sid,roomId:sroom});
      setTimeout(()=>{if(!myRoom)showStart();},2500);
    } else if(!myRoom){
      showStart();
    }
    clearInterval(pingInt);
    pingInt=setInterval(()=>{if(ws&&ws.readyState===1)ws.send(JSON.stringify({type:'ping'}));},15000);
  };

  ws.onmessage=e=>{let m;try{m=JSON.parse(e.data);}catch{return;}onMsg(m);};

  ws.onclose=()=>{
    connected=false;
    clearInterval(pingInt);
    if(myRoom)notify('Veza prekinuta, pokusavam ponovo...','w');
    sched();
  };
  ws.onerror=()=>{};
}

function sched(){clearTimeout(reconTimer);reconTimer=setTimeout(connect,2500);}

function send(d){if(ws&&ws.readyState===1)ws.send(JSON.stringify(d));}

function showStart(){
  showScreen('start-screen');
  const p=new URLSearchParams(location.search);
  const c=p.get('room');
  if(c){document.getElementById('j-code').value=c.toUpperCase();switchTab('j');}
}

// ───────────────────────────────────────────────
// MESSAGE HANDLER
// ───────────────────────────────────────────────
function onMsg(m){
  switch(m.type){

    case 'reconnectFailed':
      sessionStorage.removeItem('t19id');
      sessionStorage.removeItem('t19room');
      showStart();
      break;

    case 'reconnected':
      myId=m.playerId; myRoom=m.roomId; isHost=m.isHost||false;
      totalRnds=m.totalRounds; roundTime=m.roundTime;
      notify('Ponovo konektovan!','s');
      if(m.phase==='drawing'||m.phase==='choosing'){
        showScreen('game-screen');
        if(m.drawData&&cvs)m.drawData.forEach(d=>repDraw(d));
        isDrawer=m.drawerId===myId;
        setDrawerUI(isDrawer);
        if(m.maskedWord)renderWord(m.maskedWord,isDrawer);
        if(m.timeLeft>0)startCTimer(m.timeLeft);
      } else {
        showScreen('lobby-screen');
        updLobby(m.players);
        setRoom(m.roomId);
      }
      break;

    case 'roomCreated':
      myId=m.playerId; myRoom=m.roomId; isHost=true;
      totalRnds=m.totalRounds; roundTime=m.roundTime;
      sessionStorage.setItem('t19id',myId);
      sessionStorage.setItem('t19room',myRoom);
      showScreen('lobby-screen');
      updLobby(m.players);
      setRoom(m.roomId);
      break;

    case 'joinedRoom':
      myId=m.playerId; myRoom=m.roomId; isHost=m.isHost||false;
      totalRnds=m.totalRounds; roundTime=m.roundTime;
      sessionStorage.setItem('t19id',myId);
      sessionStorage.setItem('t19room',myRoom);
      showScreen('lobby-screen');
      updLobby(m.players);
      setRoom(m.roomId);
      if(m.drawData&&cvs)m.drawData.forEach(d=>repDraw(d));
      if(m.phase==='drawing'||m.phase==='choosing'){
        showScreen('game-screen');
        addChat({name:'Sistema',text:'Prisao si igri koja je u toku!'},true);
      }
      break;

    case 'playerJoined':
      updLobby(m.players);
      addChat({name:'Sistema',text:m.player.name+' se pridruzio!'},true);
      break;

    case 'playerDisconnected':
    case 'playerReconnected':
    case 'playerRemoved':
      updLobby(m.players);
      updStrip(m.players);
      break;

    case 'hostChanged':
      if(m.newHostId===myId){
        isHost=true;
        notify('Ti si novi domacin!','s');
        updLobby(null);
      } else {
        notify(m.newHostName+' je novi domacin','i');
      }
      break;

    case 'settingsUpdated':
      totalRnds=m.totalRounds; roundTime=m.roundTime;
      break;

    case 'gameStart':
      totalRnds=m.totalRounds; roundTime=m.roundTime;
      myScore=0;
      document.getElementById('gscore').textContent='0';
      showScreen('game-screen');
      clearCvs(true);
      break;

    case 'roundStart':
      curRnd=m.round;
      document.getElementById('g-rnd').textContent=m.round;
      document.getElementById('g-tot').textContent=m.totalRounds;
      isDrawer=m.drawerId===myId;
      hasGuessed=false;
      updStrip(m.players);
      hideOv();
      document.getElementById('reo').classList.remove('on');
      clearCvs(true);
      document.getElementById('chatmsgs').innerHTML='';
      if(isDrawer){
        setDrawerUI(true);
        addChat({name:'Sistema',text:'Ti crtas! Odaberi rec.'},true);
      } else {
        setDrawerUI(false);
        addChat({name:'Sistema',text:m.drawerName+' crta! Pogodi rec.'},true);
      }
      break;

    case 'chooseWord': showWC(m.choices); break;
    case 'choiceCountdown': document.getElementById('wccd').textContent=m.t; break;

    case 'drawingStart':
      hideWC();
      timeLeft=m.timeLeft; roundTime=m.timeLeft;
      startCTimer(m.timeLeft);
      if(m.isDrawer){
        revMask=m.word;
        renderWord(m.word,true);
        addChat({name:'Sistema',text:'Crtas: "'+m.word+'" ('+m.category+')'},true);
      } else {
        revMask=m.maskedWord;
        renderWord(m.maskedWord,false);
        addChat({name:'Sistema',text:'Kategorija: '+m.category+' | '+m.wordLength+' slova'},true);
      }
      break;

    case 'tick': timeLeft=m.t; updTimer(m.t); break;

    case 'letterReveal':
      revMask=m.mask;
      if(!isDrawer&&!hasGuessed)renderWord(m.mask,false);
      break;

    case 'draw': repDraw(m); break;
    case 'clearCanvas': clearCvs(true); break;
    case 'undoCanvas': /* handled client-side */ break;

    case 'chat': addChat(m,false); break;

    case 'closeGuess': notify('Skoro! Pokusaj ponovo.','w'); break;

    case 'youGuessed':
      hasGuessed=true;
      myScore+=m.bonus;
      document.getElementById('gscore').textContent=myScore;
      showSF(m.bonus);
      notify('Tacno! +'+m.bonus+' bodova!','s');
      renderWord(revMask.replace(/_/g,'●'),true);
      document.getElementById('chatinp').placeholder='Cavrljaj dok ostali pogadjaju...';
      document.getElementById('hbtn').disabled=true;
      break;

    case 'correctGuess':
      updStrip(m.players);
      if(m.playerId!==myId)addChat({name:m.name,text:'pogodio/la! +'+m.bonus,avatar:'✅'},false);
      break;

    case 'drawerLeft':
      addChat({name:'Sistema',text:'Crtas je napustio igru. Sledeca runda...'},true);
      updStrip(m.players);
      break;

    case 'roundEnd':
      clearInterval(timerInt);
      showRE(m);
      break;

    case 'gameEnd':
      clearInterval(timerInt);
      showGE(m);
      break;

    case 'error': notify(m.msg,'w'); break;
  }
}

// ───────────────────────────────────────────────
// UI
// ───────────────────────────────────────────────
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));
  document.getElementById(id).classList.add('on');
  if(id==='game-screen'&&!cvs)initCvs();
  if(id==='game-screen')setTimeout(resizeCvs,80);
}

function switchTab(t){
  ['c','j'].forEach(x=>{
    document.getElementById('tab-'+x).classList.toggle('on',x===t);
    document.getElementById('pnl-'+x).classList.toggle('on',x===t);
  });
}

function setRoom(code){
  document.getElementById('lcode').textContent=code;
  const link=location.origin+'/?room='+code;
  document.getElementById('invlink').textContent=link;
}

function updLobby(players){
  if(players){
    const g=document.getElementById('lgrid');
    document.getElementById('lcnt').textContent=players.length;
    g.innerHTML='';
    players.forEach(p=>{
      const d=document.createElement('div');
      d.className='pcard'+(p.isHost?' host':'')+(p.id===myId?' me':'')+(p.connected===false?' gone':'');
      d.innerHTML='<div class="pac">'+(p.avatar||'😊')+'</div><div class="pname">'+p.name+(p.connected===false?' 🔌':'')+'</div><div class="pbadge">'+(p.isHost?'Domacin':p.id===myId?'Ti':'Igrac')+'</div>';
      g.appendChild(d);
    });
  }
  document.getElementById('hsettings').style.display=isHost?'block':'none';
  document.getElementById('startbtn').style.display=isHost?'flex':'none';
  document.getElementById('waitlbl').style.display=isHost?'none':'block';
}

function updStrip(players){
  if(!players)return;
  const s=document.getElementById('pstrip');
  s.innerHTML='';
  [...players].sort((a,b)=>b.score-a.score).forEach(p=>{
    const d=document.createElement('div');
    d.className='pi'+(p.isDrawing?' drawing':'')+(p.guessed?' guessed':'')+(p.id===myId?' me':'')+(p.connected===false?' gone':'');
    d.innerHTML='<div class="piav">'+(p.avatar||'😊')+'</div><div><div class="piname">'+p.name+'</div><div class="piscr">'+p.score+'</div></div>';
    s.appendChild(d);
  });
}

function addChat(msg,sys){
  const a=document.getElementById('chatmsgs');
  const d=document.createElement('div');
  d.className='cm'+(sys?' sys':'')+(msg.isCorrect?' ok':'')+(msg.isClose?' cl':'');
  if(sys){d.innerHTML='<div class="bd"><div class="tx">'+msg.text+'</div></div>';}
  else{d.innerHTML='<div class="emj">'+(msg.avatar||'💬')+'</div><div class="bd"><div class="nm">'+msg.name+'</div><div class="tx">'+msg.text+'</div></div>';}
  a.appendChild(d);
  a.scrollTop=a.scrollHeight;
}

function renderWord(mask,show){
  const el=document.getElementById('wletters');
  el.innerHTML='';
  if(!mask)return;
  for(let i=0;i<mask.length;i++){
    const sp=document.createElement('span');
    const c=mask[i];
    if(c===' '){sp.className='wl sp';}
    else if(c==='_'){sp.className='wl h';sp.textContent=c;}
    else{sp.className='wl';sp.textContent=c;}
    el.appendChild(sp);
  }
}

function setDrawerUI(d){
  document.getElementById('tools').style.display=d?'flex':'none';
  document.getElementById('hbtn').style.display=d?'none':'block';
  document.getElementById('hbtn').disabled=false;
  document.getElementById('chatinp').placeholder=d?'Cavrljaj sa igracima...':'Pogodi rec!';
}

function showWC(choices){
  const c=document.getElementById('wcards');
  c.innerHTML='';
  choices.forEach(({w,h,cat})=>{
    const d=document.createElement('div');
    d.className='wcard';
    d.innerHTML='<div class="wcat">'+cat+'</div><div class="wword">'+w+'</div>';
    d.onclick=()=>{hideWC();send({type:'chooseWord',word:w,hint:h,cat});};
    c.appendChild(d);
  });
  document.getElementById('wccd').textContent='12';
  const bar=document.getElementById('wcbar');
  bar.style.transition='none';bar.style.width='100%';
  setTimeout(()=>{bar.style.transition='width 12s linear';bar.style.width='0%';},50);
  document.getElementById('wco').classList.add('on');
}

function hideWC(){document.getElementById('wco').classList.remove('on');}

function showOv(title,sub,word,btn){
  document.getElementById('ov-t').textContent=title;
  document.getElementById('ov-s').textContent=sub;
  const we=document.getElementById('ov-w');
  if(word){we.textContent=word;we.style.display='block';}else{we.style.display='none';}
  document.getElementById('ov-btn').style.display=btn?'block':'none';
  document.getElementById('cov').classList.add('on');
}

function hideOv(){document.getElementById('cov').classList.remove('on');}

function startCTimer(t){
  clearInterval(timerInt);
  timeLeft=t; updTimer(t);
  timerInt=setInterval(()=>{timeLeft--;if(timeLeft<0){clearInterval(timerInt);return;}updTimer(timeLeft);},1000);
}

function updTimer(t){
  document.getElementById('tnum').textContent=t;
  const arc=document.getElementById('tarc');
  const pct=t/roundTime;
  const c=119.38;
  arc.style.strokeDashoffset=c*(1-pct);
  arc.style.stroke=pct>0.5?'var(--blue)':pct>0.25?'var(--acc2)':'var(--acc)';
}

function showSF(pts){
  const el=document.createElement('div');
  el.className='sfloat';el.textContent='+'+pts;
  el.style.left='50%';el.style.top='40%';el.style.transform='translateX(-50%)';
  document.body.appendChild(el);setTimeout(()=>el.remove(),1400);
}

function notify(msg,type='i'){
  const w=document.getElementById('notifw');
  const d=document.createElement('div');
  d.className='notif '+type;d.textContent=msg;
  w.appendChild(d);setTimeout(()=>d.remove(),2200);
}

function showRE(m){
  document.getElementById('reword').textContent=m.word;
  const sc=document.getElementById('rescores');
  sc.innerHTML='';
  m.players.slice(0,5).forEach((p,i)=>{
    const d=document.createElement('div');d.className='rerow';
    d.innerHTML='<div class="rerank'+(i===0?' g':'')+'">'+(['🥇','🥈','🥉'][i]||i+1)+'</div><div class="reav">'+(p.avatar||'😊')+'</div><div class="rename">'+p.name+'</div><div class="resc">'+p.score+'</div>';
    sc.appendChild(d);
  });
  let cd=4;const cde=document.getElementById('recd');cde.textContent=cd;
  const t=setInterval(()=>{cd--;cde.textContent=cd;if(cd<=0)clearInterval(t);},1000);
  document.getElementById('reo').classList.add('on');
  setTimeout(()=>document.getElementById('reo').classList.remove('on'),3800);
}

function showGE(m){
  document.getElementById('geo').classList.add('on');
  if(m.winner)document.getElementById('gewinner').textContent=(m.winner.avatar||'🏆')+' '+m.winner.name+' — '+m.winner.score+' bodova';
  const sc=document.getElementById('gescores');sc.innerHTML='';
  m.players.forEach((p,i)=>{
    const d=document.createElement('div');d.className='rerow';
    d.innerHTML='<div class="rerank'+(i===0?' g':'')+'">'+(['🥇','🥈','🥉'][i]||i+1)+'</div><div class="reav">'+(p.avatar||'😊')+'</div><div class="rename">'+p.name+'</div><div class="resc">'+p.score+'</div>';
    sc.appendChild(d);
  });
}

function useHint(){send({type:'hint'});document.getElementById('hbtn').disabled=true;notify('Pomoc trazena!','i');}

// ───────────────────────────────────────────────
// ROOM ACTIONS
// ───────────────────────────────────────────────
function createRoom(){
  myName=document.getElementById('c-name').value.trim()||'Igrac';
  send({type:'createRoom',name:myName,avatar:myAvatar});
}
function joinRoom(){
  const code=document.getElementById('j-code').value.trim().toUpperCase();
  myName=document.getElementById('j-name').value.trim()||'Igrac';
  if(!code||code.length<4){notify('Unesi kod sobe!','w');return;}
  send({type:'joinRoom',roomId:code,name:myName,avatar:myAvatar});
}
function startGame(){send({type:'startGame'});}
function updSettings(){send({type:'updateSettings',totalRounds:+document.getElementById('s-rnd').value,roundTime:+document.getElementById('s-time').value});}
function sendChat(){
  const i=document.getElementById('chatinp');
  const t=i.value.trim();
  if(!t)return;
  send({type:'chat',text:t});
  i.value='';
}
function copyCode(){navigator.clipboard&&navigator.clipboard.writeText(myRoom).then(()=>notify('Kod kopiran!','i'));}
function copyLink(){
  const l=location.origin+'/?room='+myRoom;
  navigator.clipboard&&navigator.clipboard.writeText(l).then(()=>notify('Link kopiran!','i'));
}
function shareLink(){
  const l=location.origin+'/?room='+myRoom;
  if(navigator.share){navigator.share({title:'T19 Draw',text:'Pridruzi mi se! Kod: '+myRoom,url:l});}
  else copyLink();
}
function leaveRoom(){
  sessionStorage.removeItem('t19id');sessionStorage.removeItem('t19room');
  if(ws)ws.close();
  location.href=location.pathname;
}
function playAgain(){document.getElementById('geo').classList.remove('on');send({type:'playAgain'});}
function goMenu(){
  sessionStorage.removeItem('t19id');sessionStorage.removeItem('t19room');
  location.href=location.pathname;
}

// ───────────────────────────────────────────────
// CANVAS
// ───────────────────────────────────────────────
function initCvs(){
  cvs=document.getElementById('cvs');ctx=cvs.getContext('2d');
  resizeCvs();
  window.addEventListener('resize',resizeCvs);
  cvs.addEventListener('mousedown',sd);cvs.addEventListener('mousemove',od);
  cvs.addEventListener('mouseup',ed);cvs.addEventListener('mouseleave',ed);
  cvs.addEventListener('touchstart',e=>{e.preventDefault();const t=e.touches[0];sd({clientX:t.clientX,clientY:t.clientY});},{passive:false});
  cvs.addEventListener('touchmove',e=>{e.preventDefault();const t=e.touches[0];od({clientX:t.clientX,clientY:t.clientY});},{passive:false});
  cvs.addEventListener('touchend',ed,{passive:false});
  document.getElementById('szsl').addEventListener('input',function(){size=+this.value;updSZ();});
  buildPal();updSZ();
}

function resizeCvs(){
  if(!cvs)return;
  const r=cvs.parentElement.getBoundingClientRect();
  if(!r.width||!r.height)return;
  let img=null;
  try{if(cvs.width>0&&cvs.height>0)img=ctx.getImageData(0,0,cvs.width,cvs.height);}catch(e){}
  cvs.width=r.width;cvs.height=r.height;
  ctx.fillStyle='#fff';ctx.fillRect(0,0,cvs.width,cvs.height);
  if(img)try{ctx.putImageData(img,0,0);}catch(e){}
}

function gpos(e){const r=cvs.getBoundingClientRect();return{x:(e.clientX-r.left)*(cvs.width/r.width),y:(e.clientY-r.top)*(cvs.height/r.height)};}

function sd(e){
  if(!isDrawer)return;
  drawing=true;
  const p=gpos(e);lx=p.x;ly=p.y;sx=p.x;sy=p.y;
  if(tool==='fill'){
    saveU();
    floodFill(Math.round(p.x),Math.round(p.y),hexRgb(color));
    drawing=false;
    send({type:'draw',tool:'fill',x:p.x,y:p.y,color,cw:cvs.width,ch:cvs.height});
    return;
  }
  saveU();
  ctx.beginPath();ctx.moveTo(p.x,p.y);
}

function od(e){
  if(!drawing||!isDrawer)return;
  const p=gpos(e);
  if(tool==='brush'||tool==='eraser'){
    ctx.globalCompositeOperation=tool==='eraser'?'destination-out':'source-over';
    ctx.strokeStyle=color;ctx.lineWidth=size;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.lineTo(p.x,p.y);ctx.stroke();ctx.beginPath();ctx.moveTo(p.x,p.y);
    ctx.globalCompositeOperation='source-over';
    send({type:'draw',tool,x:p.x,y:p.y,lx,ly,color,size,cw:cvs.width,ch:cvs.height});
  } else if(['line','rect','circle'].includes(tool)){
    if(undoStack.length>0)ctx.putImageData(undoStack[undoStack.length-1],0,0);
    ctx.strokeStyle=color;ctx.lineWidth=size;ctx.lineCap='round';ctx.beginPath();
    if(tool==='line'){ctx.moveTo(sx,sy);ctx.lineTo(p.x,p.y);ctx.stroke();}
    else if(tool==='rect'){ctx.strokeRect(sx,sy,p.x-sx,p.y-sy);}
    else{const r=Math.hypot(p.x-sx,p.y-sy)/2;ctx.arc((sx+p.x)/2,(sy+p.y)/2,r,0,Math.PI*2);ctx.stroke();}
  }
  lx=p.x;ly=p.y;
}

function ed(e){
  if(!drawing)return;drawing=false;
  if(['line','rect','circle'].includes(tool)){
    send({type:'draw',tool,sx,sy,ex:lx,ey:ly,color,size,cw:cvs.width,ch:cvs.height});
  }
  ctx.beginPath();
}

function saveU(){if(!cvs)return;if(undoStack.length>=20)undoStack.shift();undoStack.push(ctx.getImageData(0,0,cvs.width,cvs.height));}

function undoCvs(){
  if(!isDrawer)return;
  if(undoStack.length>0)ctx.putImageData(undoStack.pop(),0,0);
  send({type:'undoCanvas'});
}

function clearCvs(silent){
  if(!silent&&!isDrawer)return;
  if(cvs){ctx.fillStyle='#fff';ctx.fillRect(0,0,cvs.width,cvs.height);}
  undoStack=[];
  if(!silent&&isDrawer)send({type:'clearCanvas'});
}

function setTool(t){
  tool=t;
  document.querySelectorAll('.tb').forEach(b=>b.classList.remove('on'));
  const b=document.getElementById('tb-'+t);if(b)b.classList.add('on');
}

function updSZ(){const d=document.getElementById('szdot');const s=Math.min(size,24);d.style.width=s+'px';d.style.height=s+'px';}

function buildPal(){
  const p=document.getElementById('pal');
  COLORS.forEach((c,i)=>{
    const sw=document.createElement('div');
    sw.className='sw'+(i===0?' on':'');sw.style.background=c;
    if(c==='#ffffff')sw.style.border='2px solid #666';
    sw.onclick=()=>{
      document.querySelectorAll('.sw').forEach(s=>s.classList.remove('on'));
      sw.classList.add('on');color=c;
      if(tool==='eraser')setTool('brush');
    };
    p.appendChild(sw);
  });
}

function repDraw(m){
  if(!ctx||!cvs)return;
  const sx2=cvs.width/(m.cw||cvs.width);
  const sy2=cvs.height/(m.ch||cvs.height);
  const sc=Math.min(sx2,sy2);
  if(m.tool==='brush'||m.tool==='eraser'){
    ctx.globalCompositeOperation=m.tool==='eraser'?'destination-out':'source-over';
    ctx.strokeStyle=m.color;ctx.lineWidth=m.size*sc;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.beginPath();ctx.moveTo(m.lx*sx2,m.ly*sy2);ctx.lineTo(m.x*sx2,m.y*sy2);ctx.stroke();
    ctx.globalCompositeOperation='source-over';
  } else if(m.tool==='fill'){
    floodFill(Math.round(m.x*sx2),Math.round(m.y*sy2),hexRgb(m.color));
  } else if(m.tool==='line'){
    ctx.strokeStyle=m.color;ctx.lineWidth=m.size*sc;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(m.sx*sx2,m.sy*sy2);ctx.lineTo(m.ex*sx2,m.ey*sy2);ctx.stroke();
  } else if(m.tool==='rect'){
    ctx.strokeStyle=m.color;ctx.lineWidth=m.size*sc;
    ctx.strokeRect(m.sx*sx2,m.sy*sy2,(m.ex-m.sx)*sx2,(m.ey-m.sy)*sy2);
  } else if(m.tool==='circle'){
    ctx.strokeStyle=m.color;ctx.lineWidth=m.size*sc;
    const r=Math.hypot(m.ex-m.sx,m.ey-m.sy)/2;
    ctx.beginPath();ctx.arc(((m.sx+m.ex)/2)*sx2,((m.sy+m.ey)/2)*sy2,r*sc,0,Math.PI*2);ctx.stroke();
  }
}

function hexRgb(h){return{r:parseInt(h.slice(1,3),16),g:parseInt(h.slice(3,5),16),b:parseInt(h.slice(5,7),16)};}

function floodFill(fx,fy,fill){
  if(!cvs||fx<0||fy<0||fx>=cvs.width||fy>=cvs.height)return;
  const d=ctx.getImageData(0,0,cvs.width,cvs.height);
  const data=d.data,w=cvs.width;
  const i=(fy*w+fx)*4;
  const tr=data[i],tg=data[i+1],tb=data[i+2];
  if(tr===fill.r&&tg===fill.g&&tb===fill.b)return;
  const stk=[[fx,fy]];const vis=new Set();
  while(stk.length){
    const [x,y]=stk.pop();
    if(x<0||x>=w||y<0||y>=cvs.height)continue;
    const key=y*w+x;if(vis.has(key))continue;
    const ii=(y*w+x)*4;
    if(data[ii]!==tr||data[ii+1]!==tg||data[ii+2]!==tb)continue;
    vis.add(key);
    data[ii]=fill.r;data[ii+1]=fill.g;data[ii+2]=fill.b;data[ii+3]=255;
    stk.push([x+1,y],[x-1,y],[x,y+1],[x,y-1]);
  }
  ctx.putImageData(d,0,0);
}

// ───────────────────────────────────────────────
// AVATARS
// ───────────────────────────────────────────────
function initAvs(){
  ['avs-c','avs-j'].forEach(id=>{
    const row=document.getElementById(id);
    AVATARS.forEach((av,i)=>{
      const b=document.createElement('button');
      b.className='av'+(i===0?' on':'');b.textContent=av;
      b.onclick=()=>{
        myAvatar=av;
        ['avs-c','avs-j'].forEach(rid=>{
          document.querySelectorAll('#'+rid+' .av').forEach((x,j)=>x.classList.toggle('on',j===i));
        });
      };
      row.appendChild(b);
    });
  });
}

// KEYBOARD
// ───────────────────────────────────────────────
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'){
    const a=document.activeElement;
    if(a.id==='chatinp'){sendChat();return;}
    if(a.id==='j-code'||a.id==='j-name'){joinRoom();return;}
    if(a.id==='c-name'){createRoom();return;}
  }
});

// ───────────────────────────────────────────────
// BOOT
// ───────────────────────────────────────────────
initAvs();
connect();

// Timeout — ako ne uspe za 8s, pokazi retry
setTimeout(()=>{
  if(!connected){
    document.getElementById('connlbl').textContent='Nije moguce spojiti se na server.';
    document.getElementById('retrybtn').style.display='block';
  }
},8000);
